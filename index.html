<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E4733">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="مو · روبوت فنار و IFM">
<meta property="og:image" content="icons/icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>مو · روبوت فنار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="مو، روبوت محادثة بكل موديلات فنار للذكاء الاصطناعي">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: Mo's workshop — conversations rail | the bench (chat) | Mo's stage with the mode dial. Bench sits on a faint cutting-mat dot grid. */
:root{
  --bg:#E8E6D8; --surface:#F4F2E8; --surface-2:#DFDCCB; --ink:#23261D; --muted:#676B5A;
  --olive:#5E6B4E; --olive-deep:#3E4733; --tan:#A2855A; --accent:#D96A2B; --accent-ink:#FFF8EE;
  --screen:#22251E; --screen-ink:#E8DEC6; --line:rgba(35,38,29,.13); --dot:rgba(62,71,51,.16);
  --good:#4E7A45; --warn:#B7791F; --bad:#B23A2E; --quran:#5E6B4E;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 30px -18px rgba(35,38,29,.45);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161913; --surface:#1F231B; --surface-2:#2A2F24; --ink:#ECE6D5; --muted:#A1A492;
  --olive:#93A27C; --olive-deep:#C9D3B5; --tan:#C4A574; --accent:#F0874A; --accent-ink:#1B1006;
  --screen:#0E100B; --screen-ink:#E8DEC6; --line:rgba(236,230,213,.11); --dot:rgba(201,211,181,.07);
  --good:#86B57B; --warn:#E0A84A; --bad:#E2715F; --quran:#B5C59B;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161913; --surface:#1F231B; --surface-2:#2A2F24; --ink:#ECE6D5; --muted:#A1A492;
  --olive:#93A27C; --olive-deep:#C9D3B5; --tan:#C4A574; --accent:#F0874A; --accent-ink:#1B1006;
  --screen:#0E100B; --screen-ink:#E8DEC6; --line:rgba(236,230,213,.11); --dot:rgba(201,211,181,.07);
  --good:#86B57B; --warn:#E0A84A; --bad:#E2715F; --quran:#B5C59B;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.75 var(--f-body);direction:rtl;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;accent-color:var(--accent)}
[hidden]{display:none!important}
.input.mono::placeholder{font-family:var(--f-body);direction:rtl}
.input.mono:placeholder-shown{direction:rtl;text-align:right}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:var(--olive)}
.mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr) 296px}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-block:16px;padding-inline:14px;gap:12px}
.bench{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:22px 22px}
.stage{background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding-block:18px;padding-inline:16px;gap:16px}

/* brand */
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{font:700 24px/1 var(--f-display);letter-spacing:.5px}
.brand small{display:block;font:500 11px/1.3 var(--f-mono);color:var(--muted);direction:ltr;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);padding:9px 14px;font-weight:600;font-size:14px;transition:background .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--olive-deep);color:var(--surface)}
.btn-primary:hover{background:var(--olive)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border:1px solid var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.iconbtn{width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);font-size:14px}
.convs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin-inline:-6px;padding-inline:6px}
.convs h6{font:600 11px/1 var(--f-body);color:var(--muted);letter-spacing:.6px;margin:12px 6px 6px}
.conv{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-sm);text-align:start;width:100%;font-size:14px}
.conv:hover{background:var(--surface-2)}
.conv[aria-current="true"]{background:var(--surface-2);box-shadow:inset -3px 0 0 var(--accent)}
.conv .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .m{width:8px;height:8px;border-radius:50%;flex:none;background:var(--olive)}
.conv .del{opacity:0;color:var(--muted)}
.conv:hover .del,.conv:focus-within .del{opacity:1}
.railfoot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.keystat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.led{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.led.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.led.off{background:var(--bad)}

/* topbar */
.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);z-index:2}
.top .title{flex:1;min-width:0}
.top .title b{display:block;font:600 16px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;white-space:nowrap}
.chip .mono{font-size:11px}
.only-narrow{display:none}

/* messages */
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:780px;margin-inline:auto;padding-block:24px 40px;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:12px;align-items:flex-start;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
.msg.user{flex-direction:row-reverse}
.msg.user .body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 4px var(--r);padding:10px 14px;max-width:min(560px,85%);box-shadow:var(--shadow)}
.msg.user .body p{margin:0}
.msg.user img.att{max-width:220px;border-radius:10px;display:block;margin-bottom:8px}
.avatar{width:38px;height:38px;flex:none;border-radius:11px;background:var(--screen);display:flex;align-items:center;justify-content:center;white-space:nowrap;color:var(--screen-ink);font:500 12px/1 var(--f-mono);direction:ltr;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tan) 60%,transparent)}
.avatar span{color:var(--accent)}
.msg.ai .body{flex:1;min-width:0}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin-bottom:2px}
.meta .mono{font-size:11px;color:var(--olive)}
.md{overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md p{margin:.45em 0}
.md h1,.md h2,.md h3{font-family:var(--f-display);font-weight:700;line-height:1.35;margin:1em 0 .4em;text-wrap:balance}
.md h1{font-size:1.4em}.md h2{font-size:1.22em}.md h3{font-size:1.08em}
.md ul,.md ol{padding-inline-start:1.4em;margin:.4em 0}
.md blockquote{margin:.6em 0;padding:.2em 1em;border-inline-start:3px solid var(--tan);color:var(--muted)}
.md code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);padding:.1em .35em;border-radius:5px;direction:ltr;unicode-bidi:isolate}
.md pre{background:var(--screen);color:var(--screen-ink);border-radius:12px;padding:14px 16px;overflow-x:auto;direction:ltr;text-align:left;position:relative;font-size:13px;line-height:1.6}
.md pre code{background:none;padding:0;color:inherit}
.md table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md th{background:var(--surface-2)}
.md img{border-radius:12px}
.md mark.q{background:none;color:var(--quran);font-weight:600}
.md mark.h{background:none;color:var(--tan);font-weight:600}
sup.ref{font:600 10px/1 var(--f-mono);background:var(--olive);color:var(--surface);border-radius:4px;padding:2px 4px;margin-inline:2px;cursor:pointer;vertical-align:super}
.cursor::after{content:"";display:inline-block;width:.55em;height:1em;background:var(--accent);vertical-align:-2px;margin-inline-start:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.think{border:1px dashed var(--line);border-radius:12px;margin:4px 0 10px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.think summary{cursor:pointer;padding:7px 12px;font-size:13px;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
.think summary::-webkit-details-marker{display:none}
.think .md{padding:0 14px 10px;font-size:14px;color:var(--muted)}
.refs{margin-top:10px;display:grid;gap:6px}
.refs details{background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px}
.refs summary{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.refs summary b{font:600 11px var(--f-mono);color:var(--olive)}
.refs .rc{padding:0 12px 10px;color:var(--muted);white-space:pre-wrap;max-height:180px;overflow:auto}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tools .chip{background:var(--surface-2);border-color:transparent}
.poem{font:500 1.15em/2.2 var(--f-display);text-align:center;white-space:pre-wrap;padding:18px 12px;border-block:1px solid var(--line);background:linear-gradient(var(--surface),transparent)}
.genimg{max-width:min(100%,460px);border-radius:16px;display:block;box-shadow:var(--shadow)}
.revised{font-size:13px;color:var(--muted);margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;margin-inline-start:-8px}
.actions .iconbtn{width:32px;height:32px}
.actions .iconbtn .ico{width:16px;height:16px}
.actions .iconbtn.on{color:var(--accent)}
.err{border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent);border-radius:12px;padding:10px 14px;font-size:14px}
.err b{color:var(--bad)}
.progress{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .6s}
.steps{font-size:13px;color:var(--muted);display:grid;gap:3px}
.score{display:inline-flex;gap:10px;font-size:12px}
.example-tag{font-size:11px;font-weight:600;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:0 6px}

/* empty/welcome */
.hello{display:grid;justify-items:center;text-align:center;gap:8px;padding-top:4vh}
.hello img{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(35,38,29,.22))}
.hello h1{font:700 clamp(26px,4vw,34px)/1.2 var(--f-display);margin:6px 0 0;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:46ch}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;width:100%;margin-top:18px}
.starter{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,transform .15s}
.starter:hover{border-color:var(--olive);transform:translateY(-2px)}
.starter img{width:38px;height:38px;object-fit:contain;flex:none}
.starter b{display:block;font-size:13px;color:var(--olive)}
.starter span{font-size:14px;line-height:1.5}

/* key card */
.keycard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:grid;gap:12px;width:100%;max-width:520px;text-align:start}
.keycard h2{font:700 20px/1.3 var(--f-display);margin:0}
.keycard p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;gap:8px;flex-wrap:wrap}
.input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;outline:none}
.input:focus{border-color:var(--olive)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* composer */
.dock{padding-block:8px 14px;padding-inline:max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-left,0px));padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.composer{max-width:780px;margin-inline:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:8px 8px 8px 10px}
.composer:focus-within{border-color:color-mix(in srgb,var(--olive) 60%,var(--line))}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:2px 6px 6px}
.opts select,.opts .seg{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;outline:none}
.seg{display:inline-flex;gap:0;padding:2px!important}
.seg button{padding:2px 10px;border-radius:999px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--olive-deep);color:var(--surface)}
.opts label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.attach-prev{display:flex;gap:8px;padding:4px 6px 8px}
.attach-prev .thumb{position:relative}
.attach-prev img{width:64px;height:64px;object-fit:cover;border-radius:10px;display:block}
.attach-prev .x{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.row{display:flex;align-items:flex-end;gap:4px}
.row textarea{flex:1;min-width:0;border:0;background:none;outline:none;resize:none;max-height:220px;padding:7px 6px;line-height:1.6}
.send{width:40px;height:40px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.45;cursor:default}
.send.stop{background:var(--ink);color:var(--bg)}
.hint{max-width:780px;margin:6px auto 0;font-size:11.5px;color:var(--muted);text-align:center}
.rec{color:var(--bad)!important;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.4}}

/* stage */
.mo{position:relative;display:grid;justify-items:center;padding-top:44px}
.bubble{position:absolute;top:0;inset-inline:0;margin-inline:auto;width:fit-content;max-width:100%;background:var(--screen);color:var(--screen-ink);font-size:13px;line-height:1.5;padding:7px 12px;border-radius:12px;text-align:center}
.bubble::after{content:"";position:absolute;bottom:-6px;inset-inline-start:calc(50% - 6px);border:6px solid transparent;border-bottom:0;border-top-color:var(--screen)}
.mo img{width:188px;height:188px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(35,38,29,.2));transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.mo img.pop{transform:scale(1.06) rotate(-2deg)}
.mo.busy img{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.stage h3{font:700 13px/1 var(--f-body);color:var(--muted);letter-spacing:.4px;margin:4px 0 0}
.dial{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);position:relative;transition:border-color .15s,background .15s}
.mode:hover{border-color:var(--olive)}
.mode[aria-pressed="true"]{background:var(--olive-deep);color:var(--surface);border-color:var(--olive-deep)}
.mode[aria-pressed="true"] small{color:color-mix(in srgb,var(--surface) 75%,transparent)}
.mode b{font-size:13.5px;font-weight:600}
.mode small{font-size:11px;color:var(--muted);line-height:1.35}
.mode.locked{opacity:.55}
.mode .lock{position:absolute;top:8px;inset-inline-end:8px;width:14px;height:14px}
.quota{display:grid;gap:6px;font-size:12px}
.q{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.q .mono{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.q .bar i{display:block;height:100%;background:var(--olive)}
.q .bar i.low{background:var(--warn)}
.q .bar i.out{background:var(--bad)}
.stage .note{font-size:12px;color:var(--muted)}

/* strip (narrow stage) */
.strip{display:none}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,17,12,.45);z-index:20;display:flex;justify-content:flex-start}
.sheet{background:var(--surface);width:min(440px,100%);height:100%;overflow-y:auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 24px;padding-inline:max(18px,env(safe-area-inset-right,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;box-shadow:0 0 40px rgba(0,0,0,.3);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(-30px);opacity:.4}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font:700 20px/1 var(--f-display);margin:0}
.sheet section{display:grid;gap:10px}
.sheet h4{margin:0;font-size:12px;letter-spacing:.5px;color:var(--muted)}
.sheet label.f{display:grid;gap:4px;font-size:13px}
.sheet textarea.input{min-height:110px;resize:vertical;line-height:1.6}
.sheet select.input{padding:8px 10px}
.danger{color:var(--bad)}
.toast{position:fixed;bottom:max(22px,env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;z-index:40;box-shadow:var(--shadow)}
.drawer-scrim{display:none}

@media (max-width:1180px){.app{grid-template-columns:248px minmax(0,1fr)}.stage{display:none}
  .strip{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto 8px;min-width:0}
  .strip img{width:54px;height:54px;object-fit:contain;flex:none}
  .strip .modes{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;padding-block:2px}
  .strip .modes::-webkit-scrollbar{display:none}
  .strip .mode{flex-direction:row;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;white-space:nowrap}
  .strip .mode small{display:none}
  .strip .mode .lock{position:static}
  .only-mid{display:inline-grid}}
@media (min-width:1181px){.only-mid{display:none}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset-block:0;inset-inline-start:0;width:min(300px,86vw);z-index:30;transform:translateX(105%);transition:transform .22s;padding-top:max(16px,env(safe-area-inset-top,0px));padding-inline-start:max(14px,env(safe-area-inset-right,0px))}
  .app.drawer .rail{transform:none}
  .app.drawer .drawer-scrim{display:block;position:fixed;inset:0;background:rgba(15,17,12,.45);z-index:25}
  .only-narrow{display:inline-grid}
  .top .chip.quota-chip{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="المحادثات">
    <div class="brand"><img id="brandImg" alt=""><div><b>مو</b><small>fanar · ifm · iegy.net</small></div></div>
    <button class="btn btn-primary" id="newChat"><svg class="ico"><use href="#i-plus"/></svg>محادثة جديدة</button>
    <label class="search"><svg class="ico"><use href="#i-search"/></svg><input id="q" type="search" placeholder="دوّر في محادثاتك" aria-label="بحث في المحادثات"></label>
    <nav class="convs" id="convs"></nav>
    <div class="railfoot">
      <div class="keystat"><span class="led" id="led"></span><span id="keyText">مفيش مفتاح</span></div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost" style="flex:1" id="openSettings"><svg class="ico"><use href="#i-gear"/></svg>الإعدادات</button>
        <button class="iconbtn" id="themeBtn" title="تبديل الوضع الفاتح والداكن" aria-label="تبديل الوضع"><svg class="ico"><use href="#i-moon"/></svg></button>
      </div>
    </div>
  </aside>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <main class="bench">
    <header class="top">
      <button class="iconbtn only-narrow" id="menuBtn" aria-label="المحادثات"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="title"><b id="convTitle">محادثة جديدة</b><span id="modeLine"></span></div>
      <span class="chip quota-chip" id="quotaChip" hidden></span>
      <button class="iconbtn" id="exportBtn" title="نسخ المحادثة كنص" aria-label="نسخ المحادثة"><svg class="ico"><use href="#i-copy"/></svg></button>
      <button class="iconbtn only-mid" id="settingsTop" aria-label="الإعدادات"><svg class="ico"><use href="#i-gear"/></svg></button>
    </header>
    <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
    <div class="dock">
      <div class="strip" id="strip"><img id="stripMo" alt="مو"><div class="modes" id="stripModes"></div></div>
      <div class="composer">
        <div class="opts" id="opts"></div>
        <div class="attach-prev" id="attachPrev" hidden></div>
        <div class="row">
          <button class="iconbtn" id="attachBtn" title="صورة لمو العين" aria-label="إرفاق صورة"><svg class="ico"><use href="#i-image"/></svg></button>
          <button class="iconbtn" id="audioBtn" title="حوّل تسجيل صوتي لنص" aria-label="تفريغ ملف صوتي"><svg class="ico"><use href="#i-wave"/></svg></button>
          <button class="iconbtn" id="micBtn" title="سجّل بصوتك" aria-label="تسجيل بالميكروفون"><svg class="ico"><use href="#i-mic"/></svg></button>
          <textarea id="input" rows="1" placeholder="اكتب لمو…" aria-label="رسالتك"></textarea>
          <button class="send" id="sendBtn" aria-label="إرسال"><svg class="ico"><use href="#i-send"/></svg></button>
        </div>
      </div>
      <div class="hint" id="hint">Enter للإرسال · Shift+Enter لسطر جديد · مفتاحك بيفضل على جهازك</div>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <input type="file" id="audFile" accept="audio/*,video/*" hidden>
    </div>
  </main>

  <aside class="stage" aria-label="مو">
    <div class="mo" id="mo"><div class="bubble" id="bubble">أهلاً، أنا مو</div><img id="moImg" alt="مو الروبوت"></div>
    <h3>أوضاع مو</h3>
    <div class="dial" id="dial"></div>
    <h3>رصيدك المتبقي</h3>
    <div class="quota" id="quota"><span class="note">هيظهر هنا عدد الطلبات المتبقية لكل موديل بعد أول استخدام.</span></div>
  </aside>
</div>

class FanarError extends Error{constructor(status,code,message,retry){super(message);this.status=status;this.code=code;this.retry=retry}}
function trackQuota(model,res,ifm){
  const h=n=>res.headers.get(n);
  if(ifm){
    const lim=h("ifm-ratelimit-tokens-limit")||h("x-ratelimit-limit-tokens"),rem=h("ifm-ratelimit-tokens-remaining")||h("x-ratelimit-remaining-tokens"),win=h("ifm-ratelimit-tokens-window");
    if(lim==null&&rem==null)return;
    const w=win?(/^\d+$/.test(win)?+win:/d/.test(win)?86400:/h/.test(win)?3600:60):null;
    S.quotas["IFM"]={limit:+lim,remaining:+rem,window:w,unit:"tokens",at:Date.now()};
  }else{
    const lim=h("x-ratelimit-limit"),rem=h("x-ratelimit-remaining"),pol=h("ratelimit-policy");
    if(lim==null&&rem==null)return;
    const w=pol&&+(pol.split("w=")[1]||0);
    S.quotas[model]={limit:+lim,remaining:+rem,window:w||null,at:Date.now()};
  }
  ls.set("quotas",S.quotas);renderQuota();
}
async function api(path,{method="POST",body,form,model,signal,ifm,session}={}){
  ifm=ifm||isIFM(model);
  const k=ifm?ifmKey():key();
  if(!k)throw new FanarError(0,"no_key",ifm?"الموديل ده من IFM ومحتاج مفتاح IFM. ضيفه من الإعدادات.":"الموديل ده من فنار ومحتاج مفتاح فنار. ضيفه من الإعدادات.");
  const headers={Authorization:"Bearer "+k};if(!form)headers["Content-Type"]="application/json";if(ifm&&session)headers["X-Session-ID"]=session;
  let res;
  try{res=await fetch((ifm?IFM_API:API)+path,{method,signal,headers,body:form||(body?JSON.stringify(body):undefined)})}
  catch(e){if(e.name==="AbortError")throw e;throw new FanarError(0,"network",`مش قادر أوصل لـ${ifm?"IFM":"فنار"}. اتأكد من الإنترنت وجرّب تاني.`)}
  if(model)trackQuota(model,res,ifm);
  if(!res.ok){
    let j={};try{j=await res.json()}catch{}
    const e=typeof j.error==="object"?j.error:{message:j.error||j.detail||j.message};const retry=res.headers.get("retry-after");
    if(res.status===403&&model){S.locked.add(model);ls.set("locked",[...S.locked]);renderModes()}
    throw new FanarError(res.status,e.code||e.type||"",friendly(res.status,e,retry,model,ifm),retry);
  }
  if(model&&S.locked.has(model)){S.locked.delete(model);ls.set("locked",[...S.locked]);renderModes()}
  return res;
}
function friendly(st,e,retry,model,ifm){
  const m=model?` (${mlabel(model)})`:"";
  if(st===401)return `مفتاح ${ifm?"IFM":"فنار"} غلط أو انتهى. راجعه من الإعدادات.`;
  if(st===403)return ifm?`مفتاح IFM مش مسموح له بالموديل ده${m}. راجع حسابك على platform.ifm.ai.`:`مفتاحك مش مفعّل له الموديل ده${m}. فنار بيفعّل الموديلات المتقدمة بطلب: اكتب لهم على support@fanar.qa.`;
  if(st===429&&ifm)return `خلص رصيد التوكنز اليومي عند IFM (10 مليون في اليوم، وبيتجدد 2 الفجر بتوقيت القاهرة)`+(retry?`. جرّب تاني بعد ${fmtWait(+retry)}.`:".");
  if(st===429)return `خلص الرصيد المسموح للموديل ده${m}`+(retry?`. جرّب تاني بعد ${fmtWait(+retry)}.`:".");
  if(st===400&&e.code==="content_filter")return "فنار رفض الطلب ده لأنه اتصنّف كمحتوى غير مناسب. جرّب تصيغه بشكل تاني.";
  if(st===413)return "الطلب أطول من المسموح. جرّب محادثة جديدة أو نص أقصر.";
  if(st===503)return "سيرفرات فنار مزحومة دلوقتي. استنى شوية وجرّب.";
  if(st===504)return "الطلب أخد وقت أطول من المسموح. جرّب تاني.";
  return (e.message||"حصل خطأ غير متوقع")+` (${st})`;
}
function fmtWait(s){if(s<90)return `${s} ثانية`;if(s<5400)return `${Math.ceil(s/60)} دقيقة`;return `${Math.ceil(s/3600)} ساعة`}
async function sse(res,onData){
  const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
      if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(d==="[DONE]")return;
      let j;try{j=JSON.parse(d)}catch{continue}
      if(j.error)throw new FanarError(500,j.error.code,j.error.message||"خطأ أثناء البث");onData(j)}}
}

/* =============== auto routing =============== */
function route(text,hasImage){
  const t=text.trim();
  if(hasImage)return "eye";
  if(/^(ارسم|ارسملي|ارسم لي|صمم صورة|صورة ل|اعمل صورة|اعملي صورة|draw|generate an image|paint)/i.test(t))return "painter";
  if(/(قصيدة|قصيده|ابيات|أبيات|شعر عن|اكتب شعر|بيت شعر|poem)/i.test(t))return "poet";
  if(/^(ترجم|ترجملي|ترجم لي|translate)/i.test(t))return "translate";
  if(/(احسب|كم الساعة|الساعة كام|كام يوم|الفرق بين تاريخ|calculate|\d+\s*[\+\-\*\/×÷]\s*\d+)/i.test(t))return "tools";
  if(/(حكم|فتوى|حلال|حرام|يجوز|زكاة|صلاة|الصلاة|صيام|الصيام|الحج|العمرة|حديث|الأحاديث|آية|الآية|تفسير|سورة|الفقه|مذهب|الشرع|النبي|الرسول|الصحابة|القرآن|الطهارة|الوضوء|الميراث|المواريث)/.test(t))return modeAvailable("sadiq")?"sadiq":"chat";
  if(/(فكر خطوة|خطوة بخطوة|اثبت|برهن|لغز|مسألة|معادلة|step by step|prove)/i.test(t))return modeAvailable("think")?"think":"chat";
  return "chat";
}

/* =============== sending =============== */
async function send(){
  if(S.busy){stop();return}
  const input=$("#input"),text=input.value.trim(),img=S.attach;
  if(!text&&!img)return;
  if(!anyKey()){toast("حط مفتاح فنار أو IFM الأول");mo("chill",LINES.nokey[0]);renderThread();return}
  let c=curConv();if(!c||c.example)c=newConv();
  let mode=S.mode,auto=false;
  if(mode==="auto"){mode=route(text,!!img);auto=true}
  if(img&&mode!=="eye"){mode="eye";auto=true}
  if(mode==="eye"&&!img&&!c.messages.some(m=>m.image)){toast("ارفع صورة الأول عشان مو العين يشوفها");$("#imgFile").click();return}
  const um={id:uid(),role:"user",content:text||"وصف الصورة دي",image:img||null,mode};
  c.messages.push(um);
  if(c.messages.filter(m=>m.role==="user").length===1)c.title=(text||"صورة").replace(/\s+/g," ").slice(0,48);
  input.value="";autosize();clearAttach();
  await runAi(c,mode,auto);
}
async function runAi(c,mode,auto){
  const am={id:uid(),role:"ai",mode,auto,model:currentModel(mode),content:"",pending:true,t0:Date.now()};
  if(mode==="poet")am.kind="poem";if(mode==="painter")am.kind="image";if(mode==="research")am.kind="research";
  c.messages.push(am);touch(c);renderThread();
  setBusy(true);S.abort=new AbortController();
  const spr=MODES[mode].spr;
  mo(spr==="idle"?"confused":(mode==="chat"?"confused":spr),pick(LINES[{think:"think",poet:"poet",painter:"paint",eye:"eye",research:"research"}[mode]]||LINES.wait),{busy:true});
  try{
    const fn={chat:doChat,think:doChat,sadiq:doChat,eye:doChat,poet:doPoem,painter:doImage,translate:doTranslate,tools:doTools,research:doResearch}[mode];
    await fn(c,am,mode);
    am.pending=false;am.ms=Date.now()-am.t0;
    mo(mode==="research"?"works":pick(["thumbs","works","idle"]),pick(LINES.done));
  }catch(e){
    am.pending=false;
    if(e.name==="AbortError"){if(!am.content&&!am.image)am.error="وقفت الرد بناءً على طلبك.";am.errorTitle="اتوقف";mo("chill","تمام، وقفت")}
    else{am.error=e.message;am.errorTitle=e.status===429?"الرصيد خلص":e.status===403?"الموديل مش مفعّل":"مقدرتش أكمّل";
      mo(e.status===429?"cry":e.status===403?"confused":"broken",e.status===429?LINES.quota[0]:e.status===403?LINES.locked[0]:pick(LINES.error))}
  }finally{
    delete am.t0;setBusy(false);S.abort=null;touch(c);rerender(am);
  }
}
function setBusy(b){S.busy=b;const s=$("#sendBtn");s.classList.toggle("stop",b);s.innerHTML=ico(b?"stop":"send");s.setAttribute("aria-label",b?"إيقاف":"إرسال")}
function stop(){S.abort?.abort()}

function history(c,am,{vision=false,max=14,ifm=false}={}){
  const msgs=[];
  for(const m of c.messages){if(m===am)break;
    if(m.role==="user"){
      if(vision&&m.image)msgs.push({role:"user",content:[{type:"text",text:m.content},{type:"image_url",image_url:{url:m.image}}]});
      else msgs.push({role:"user",content:m.content+(m.image?"\n[أرفقت صورة]":"")});
    }else if(!m.error){
      const t=m.kind==="image"?`[صورة مولّدة: ${m.prompt||""}]`:m.content;
      if(t){const a={role:"assistant",content:t};
        /* IFM asks for its own reasoning trace replayed verbatim; other turns carry "" */
        if(ifm)a.reasoning_content=(isIFM(m.model)&&m.thinkingRaw!=null)?m.thinkingRaw:"";
        msgs.push(a)}}
  }
  let out=msgs.slice(-max);while(out.length&&out[0].role!=="user")out.shift();
  if(vision){let seen=false;for(let i=out.length-1;i>=0;i--){if(Array.isArray(out[i].content)){if(seen)out[i]={role:"user",content:out[i].content[0].text+"\n[صورة سابقة]"};seen=true}}}
  return out;
}

async function doChat(c,am,mode){
  const s=S.settings,model=am.model;
  const body={model,stream:true};
  if(mode==="sadiq"){
    body.messages=history(c,am,{max:8});
    if(model==="Fanar-Sadiq-2"){if(s.madhab&&s.madhab!=="all")body.madhab=[s.madhab]}
    else{body.persona=s.persona;body.max_tokens=Math.min(+s.maxTokens||1500,2000)}
  }else if(mode==="eye"){
    body.messages=history(c,am,{vision:true,max:6});body.max_tokens=Math.min(+s.maxTokens||1024,1500);
  }else if(isIFM(model)){
    /* IFM: K2 Horizon / Jais 3 always reason; chat mode uses the lightest effort */
    let effort=mode==="think"?s.effort:"low";if(model===JAIS&&effort==="medium")effort="high";
    body.messages=[{role:"system",content:s.persona||DEFAULT_PERSONA},...history(c,am,{ifm:true,max:20})];
    body.temperature=model===K2?1.0:(mode==="think"?0.7:Math.min(+s.temperature,0.7)||0.2);
    body.top_p=0.95;body.max_tokens=mode==="think"?Math.max(8000,+s.maxTokens||0):Math.max(+s.maxTokens||2048,3000);
    body.chat_template_kwargs={reasoning_effort:effort};am.effort=effort;
  }else{
    body.messages=[{role:"system",content:s.persona||DEFAULT_PERSONA},...history(c,am)];
    body.temperature=+s.temperature;body.max_tokens=+s.maxTokens||2048;
    if(mode==="think"){body.enable_thinking=true;body.max_tokens=Math.max(4000,+s.maxTokens||0)}
  }
  const res=await api("/v1/chat/completions",{body,model,signal:S.abort.signal,session:c.id});
  let raw="",first=true;
  const apply=()=>{
    const i=raw.indexOf("<think>"),j=raw.indexOf("</think>");
    if(i>=0){am.thinking=raw.slice(i+7,j>=0?j:undefined).trim();am.content=(raw.slice(0,i)+(j>=0?raw.slice(j+8):"")).trim()}
    else if(j>=0){am.thinking=raw.slice(0,j).trim();am.content=raw.slice(j+8).trim()}
    else am.content=raw;
  };
  let pend=false;const flush=()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;rerender(am)})};
  if((res.headers.get("content-type")||"").includes("json")){
    const j=await res.json();const msg=j.choices?.[0]?.message||{};raw=msg.content||"";am.refs=msg.references||null;
    const rc=msg.reasoning_content??msg.reasoning;if(rc!=null){am.thinkingRaw=rc;am.thinking=cleanReason(rc)}apply();return;
  }
  if(isIFM(model))am.thinkingRaw="";
  await sse(res,j=>{
    if(j.progress){am.steps=(am.steps||[]).concat(j.progress.message?.ar||j.progress.message?.en||"");return}
    const d=j.choices?.[0]?.delta||{};
    if(d.references&&d.references.length)am.refs=d.references;
    const r=d.reasoning_content||d.reasoning||d.thinking;
    if(r){am.thinkingRaw=(am.thinkingRaw||"")+r;am.thinking=cleanReason(am.thinkingRaw);if(first&&!raw)mo("idea",LINES.think[0],{busy:true});flush()}
    if(d.content){raw+=d.content;apply();if(first){first=false;mo(MODES[mode].spr==="idle"?"typing":"typing",pick(LINES.stream),{busy:true})}flush()}
  });
  apply();
}
const cleanReason=t=>String(t||"").replace(/<ifm\|[a-z_]+>/g,"").trim();

/* --- tools mode --- */
const TOOLDEFS=[
  {type:"function",function:{name:"calculate",description:"Evaluate an arithmetic expression. Supports + - * / % ^ parentheses, sqrt, sin, cos, tan, log, ln, pi, e.",parameters:{type:"object",properties:{expression:{type:"string",description:"e.g. (12.5*4)^2/3"}},required:["expression"]}}},
  {type:"function",function:{name:"get_local_time",description:"Get the current local date and time in an IANA timezone.",parameters:{type:"object",properties:{timezone:{type:"string",description:"IANA timezone, e.g. Africa/Cairo"}},required:["timezone"]}}},
  {type:"function",function:{name:"days_between",description:"Number of days between two dates.",parameters:{type:"object",properties:{from:{type:"string",description:"YYYY-MM-DD"},to:{type:"string",description:"YYYY-MM-DD"}},required:["from","to"]}}},
  {type:"function",function:{name:"convert_units",description:"Convert between common units of length, mass and temperature.",parameters:{type:"object",properties:{value:{type:"number"},from:{type:"string",description:"km, m, cm, mi, ft, in, kg, g, lb, oz, c, f"},to:{type:"string"}},required:["value","from","to"]}}}
];
function calc(expr){
  const e=String(expr).replace(/×/g,"*").replace(/÷/g,"/").replace(/\^/g,"**").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
  if(!/^[\d\s+\-*/%().,a-z]*$/i.test(e))throw new Error("expression has unsupported characters");
  const words=e.match(/[a-z]+/gi)||[];const ok=["sqrt","sin","cos","tan","log","ln","pi","e","abs","round"];
  if(words.some(w=>!ok.includes(w.toLowerCase())))throw new Error("unknown function");
  const f=new Function("sqrt","sin","cos","tan","log","ln","pi","e","abs","round",`"use strict";return (${e.replace(/,/g,".")})`);
  const v=f(Math.sqrt,Math.sin,Math.cos,Math.tan,Math.log10,Math.log,Math.PI,Math.E,Math.abs,Math.round);
  if(typeof v!=="number"||!isFinite(v))throw new Error("result is not a finite number");
  return +v.toPrecision(12);
}
function runTool(name,args){
  try{
    if(name==="calculate")return {result:calc(args.expression)};
    if(name==="get_local_time"){const d=new Date();return {timezone:args.timezone,local_time:d.toLocaleString("en-CA",{timeZone:args.timezone,hour12:false}),weekday:d.toLocaleDateString("ar-EG",{timeZone:args.timezone,weekday:"long"})}}
    if(name==="days_between"){const a=new Date(args.from),b=new Date(args.to);if(isNaN(a)||isNaN(b))throw new Error("invalid date");return {days:Math.round((b-a)/864e5)}}
    if(name==="convert_units"){const L={km:1000,m:1,cm:.01,mi:1609.344,ft:.3048,in:.0254},M={kg:1,g:.001,lb:.45359237,oz:.028349523};const f=args.from.toLowerCase(),t=args.to.toLowerCase(),v=+args.value;
      if(L[f]&&L[t])return {result:+(v*L[f]/L[t]).toPrecision(10),unit:t};if(M[f]&&M[t])return {result:+(v*M[f]/M[t]).toPrecision(10),unit:t};
      if(f==="c"&&t==="f")return {result:+(v*9/5+32).toFixed(2),unit:"F"};if(f==="f"&&t==="c")return {result:+((v-32)*5/9).toFixed(2),unit:"C"};throw new Error("unsupported units")}
    return {error:"unknown tool "+name};
  }catch(e){return {error:e.message}}
}
async function doTools(c,am){
  const msgs=[{role:"system",content:"أنت «مو» في وضع الصنايعي. استخدم الأدوات المتاحة للحساب والوقت والتواريخ وتحويل الوحدات، ثم أجب بالعربية باختصار. اليوم "+new Date().toISOString().slice(0,10)+"."},...history(c,am,{max:6})];
  am.tools=[];
  for(let round=1;round<=4;round++){
    const res=await api("/v1/chat/completions",{body:{model:"Fanar-2.0-Tools",messages:msgs,tools:TOOLDEFS,temperature:0,tool_choice:round===4?"none":"auto"},model:"Fanar-2.0-Tools",signal:S.abort.signal});
    const j=await res.json();const ch=j.choices?.[0]||{};const msg=ch.message||{};
    if(ch.finish_reason!=="tool_calls"||!msg.tool_calls?.length){am.content=msg.content||"";return}
    msgs.push({role:"assistant",content:msg.content||null,tool_calls:msg.tool_calls});
    for(const call of msg.tool_calls){let args={};try{args=JSON.parse(call.function.arguments||"{}")}catch{}
      const out=runTool(call.function.name,args);
      am.tools.push({name:call.function.name,args:Object.values(args).join(", "),result:out.error?"خطأ":(out.result??out.local_time??out.days??"تم")});rerender(am);
      msgs.push({role:"tool",tool_call_id:call.id,content:JSON.stringify(out)})}
  }
}

async function doResearch(c,am){
  const last=c.messages[c.messages.indexOf(am)-1];am.depth=S.settings.depth;
  const res=await api("/v1/sadiq/deep-research",{body:{model:"Fanar-Sadiq-2",input:last.content,depth:S.settings.depth,web_search:!!S.settings.webSearch,background:true},model:"Fanar-Sadiq-2",signal:S.abort.signal});
  const job=await res.json();am.job={id:job.id,status:job.status,progress:job.progress_pct||0};touch(c);rerender(am);

async function pollResearch(c,am,signal){
  for(;;){
    await new Promise((r,rj)=>{const t=setTimeout(r,7000);signal?.addEventListener("abort",()=>{clearTimeout(t);rj(new DOMException("aborted","AbortError"))},{once:true})});
    const r=await api("/v1/sadiq/deep-research/"+am.job.id,{method:"GET",signal});const j=await r.json();
    am.job.status=j.status;am.job.progress=j.progress_pct||am.job.progress;
    const sprs=["walk","reading","search","laptop"];mo(sprs[Math.floor(Date.now()/14000)%sprs.length],`بلف على المصادر · ${am.job.progress}%`,{busy:true});
    if(j.status==="completed"){const rep=j.result||{};am.content=rep.markdown||((rep.title?"# "+rep.title+"\n\n":"")+(rep.overview||"")+"\n\n"+(rep.sections||[]).map(s=>s.content).join("\n\n"));
      am.refs=(rep.sources||[]).filter(s=>s.was_cited!==false).slice(0,40).map((s,i)=>({number:i+1,source:s.source,content:(s.citation_tag?s.citation_tag+"\n":"")+(s.quote||"")}));delete am.job;return}
    if(j.status==="failed"||j.status==="cancelled"||j.status==="incomplete"){delete am.job;throw new FanarError(500,j.status,j.status==="incomplete"?"فلتر المحتوى عند فنار وقّف التقرير قبل ما يكمل.":j.status==="cancelled"?"البحث اتلغى.":(j.error?.message||"البحث فشل عند فنار."))}
    touch(c);rerender(am);
  }
}

function shrinkImage(src,max=1280,type="image/jpeg",q=.86){return new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);try{res(cv.toDataURL(type,q))}catch{res(src)}};im.onerror=()=>res(src);im.src=src})}
function showAttach(){const p=$("#attachPrev");if(!S.attach){p.hidden=true;p.innerHTML="";return}p.hidden=false;p.innerHTML=`<div class="thumb"><img src="${S.attach}" alt="الصورة المرفقة"><button class="x" aria-label="إزالة الصورة">${ico("x")}</button></div>`;p.querySelector(".x").onclick=clearAttach}
function clearAttach(){S.attach=null;showAttach()}

const DIALECTS={EG:"المصرية",SA:"السعودية",AE:"الإماراتية",QA:"القطرية",KW:"الكويتية",BH:"البحرينية",OM:"العمانية",YE:"اليمنية",IQ:"العراقية",SY:"السورية",LB:"اللبنانية",JO:"الأردنية",PS:"الفلسطينية",SD:"السودانية",LY:"الليبية",TN:"التونسية",DZ:"الجزائرية",MA:"المغربية",MR:"الموريتانية",MSA:"الفصحى",EN:"الإنجليزية",FR:"الفرنسية",ES:"الإسبانية",IT:"الإيطالية"};
async function transcribe(blob,name){
  if(!anyKey()){toast("حط مفتاح فنار أو IFM الأول");return}
  const useIfm=(S.settings.stt==="ifm"&&ifmKey())||!key();
  const model=useIfm?"IFM/Jais-ASR":"Fanar-3.0-Aura-Transcribe";const big=!useIfm&&blob.size>8*1024*1024;
  const f=new FormData();f.append("file",blob,name);f.append("model",model);if(big)f.append("background","true");
  if(useIfm){f.append("diacritics",S.settings.diacritics?"true":"false");f.append("code_switch","true")}
  mo("music",useIfm?"Jais بيسمع اللهجة…":"بسمع وبكتب…",{busy:true});$("#hint").textContent="بفرّغ الصوت…";
  try{
    const r=await api("/v1/audio/transcriptions",{form:f,model});let j=await r.json();
    if(useIfm&&j.no_speech){toast("مسمعتش كلام في التسجيل ده");mo("confused","التسجيل فاضي؟");return}
    if(useIfm&&j.language){const d=DIALECTS[j.language.replace(/[\[\]]/g,"").toUpperCase()];if(d)toast("اللهجة: "+d)}
    while(j.object==="job"&&(j.status==="queued"||j.status==="in_progress")){await new Promise(x=>setTimeout(x,5000));$("#hint").textContent=`بفرّغ الصوت… ${j.progress_pct||0}%`;j=await (await api("/v1/audio/transcriptions/"+j.id,{method:"GET"})).json()}
    const text=j.text||j.result?.text||"";if(j.status==="failed")throw new FanarError(500,"",j.error?.message||"التفريغ فشل");
    const inp=$("#input");inp.value=(inp.value?inp.value+"\n":"")+text;autosize();inp.focus();mo("thumbs","كتبت اللي قلته، راجعه وابعته");
  }catch(e){toast(e.message);mo(e.status===429?"cry":"broken",e.status===403?LINES.locked[0]:pick(LINES.error))}
  finally{$("#hint").textContent="Enter للإرسال · Shift+Enter لسطر جديد · مفتاحك بيفضل على جهازك"}
}
async function toggleMic(){
  const btn=$("#micBtn");
  if(S.rec){S.rec.stop();return}
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast("المتصفح ده مش بيسمح بالتسجيل هنا، ارفع ملف صوتي بدل كده");$("#audFile").click();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});const rec=new MediaRecorder(stream);const chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());S.rec=null;btn.classList.remove("rec");const b=new Blob(chunks,{type:rec.mimeType||"audio/webm"});transcribe(b,"voice."+((rec.mimeType||"").includes("mp4")?"m4a":"webm"))};
    rec.start();S.rec=rec;btn.classList.add("rec");mo("music",LINES.listen[0],{busy:true});
  }catch{toast("مقدرتش أفتح الميكروفون. ارفع ملف صوتي بدل كده.");$("#audFile").click()}
}

  if(anyKey()&&S.current==="example")S.current=null;
  if(S.convs.length&&!S.convs[0].example&&S.convs[0].messages.length===0)S.current=S.convs[0].id;
  updateKeyUI();renderConvs();renderModes();renderOpts();renderThread();renderQuota();
  mo(anyKey()?MODES[S.mode].spr:"chill",anyKey()?pick(LINES.idle):LINES.nokey[0],{hold:true});
  resumeJobs();

  $("#sendBtn").onclick=send;
  $("#input").addEventListener("input",autosize);
  $("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
  $("#input").addEventListener("paste",e=>{const f=[...(e.clipboardData?.files||[])].find(f=>f.type.startsWith("image/"));if(f){e.preventDefault();onImage(f)}});
  $("#newChat").onclick=()=>{const c=curConv();if(c&&!c.example&&!c.messages.length){$("#input").focus();return}S.current=null;renderConvs();renderThread();$("#app").classList.remove("drawer");mo("excited","يلا نبدأ من جديد");$("#input").focus()};
  $("#q").oninput=renderConvs;
  $("#openSettings").onclick=openSettings;$("#settingsTop").onclick=openSettings;
  $("#themeBtn").onclick=()=>{const dark=matchMedia("(prefers-color-scheme: dark)").matches;const cur=S.settings.theme||(dark?"dark":"light");S.settings.theme=cur==="dark"?"light":"dark";saveSettings();applyTheme()};
  $("#menuBtn").onclick=()=>$("#app").classList.add("drawer");$("#drawerScrim").onclick=()=>$("#app").classList.remove("drawer");
  $("#exportBtn").onclick=exportConv;
  $("#attachBtn").onclick=()=>$("#imgFile").click();$("#imgFile").onchange=e=>{onImage(e.target.files[0]);e.target.value=""};
  $("#audioBtn").onclick=()=>$("#audFile").click();$("#audFile").onchange=e=>{const f=e.target.files[0];if(f)transcribe(f,f.name);e.target.value=""};
  $("#micBtn").onclick=toggleMic;
  const bench=document.querySelector(".bench");
  bench.addEventListener("dragover",e=>{e.preventDefault()});bench.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer?.files?.[0];if(!f)return;if(f.type.startsWith("image/"))onImage(f);else if(/audio|video/.test(f.type))transcribe(f,f.name)});
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#newChat").click()}if(e.key==="Escape"&&S.busy)stop()});
  autosize();
}
boot();
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
